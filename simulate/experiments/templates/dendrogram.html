<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --grid:#e3e3e3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e8e8e8; --muted:#9aa0a6; --grid:#2c3036; }
  }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif;
         display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--grid);
           display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size:16px; margin:0 0 2px; }
  header p { margin:0; color:var(--muted); font-size:12px; }
  main { flex:1; min-height:0; padding:8px 16px 16px; position:relative; }
  #c, #d { width:100%; height:100%; display:block; }
  .tbtn { border:1px solid var(--grid); background:var(--bg); color:var(--fg);
          padding:2px 8px; font-size:11px; cursor:pointer; border-radius:3px; }
  .tbtn.active { background:var(--fg); color:var(--bg); }
  .tbtn:hover { filter:brightness(1.15); }
</style>
</head>
<body>
<header style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
  <div>
    <h1>__TITLE__</h1>
    <p id="sub"></p>
  </div>
  <div id="view-toggle" style="display:flex; gap:6px;">
    <button id="btn-scatter" class="tbtn active">Scatter</button>
    <button id="btn-dendro" class="tbtn">Dendrogram</button>
  </div>
</header>
<main><canvas id="c"></canvas><canvas id="d" style="display:none"></canvas></main>
__CHARTJS__
__SCRIPTS__
</body>
</html>
