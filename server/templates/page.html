<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{paper_name}} - {{date_long}}</title>
<style>{{css}}</style>
<link rel="stylesheet" href="/static/app.css">
<script id="boot" type="application/json">{{boot}}</script>
<script src="/static/genmodel.js"></script>
<script src="/static/client.js" defer></script>
</head>
<body class="bg-stone-100 font-paper text-stone-900 antialiased dark:bg-slate-950 dark:text-slate-200">
<div class="mx-auto max-w-6xl px-4 py-6 sm:px-8">

  <div id="toolbar" class="brief-toolbar">
    <select id="brief-select" aria-label="Choose brief">{{brief_options}}</select>
    <span id="status" class="{{status_class}}">{{status}}</span>
    <span class="spacer"></span>
    <select id="engine-select" aria-label="Selection engine">
      <option value="keyword">Keyword</option>
      <option value="lr">LR</option>
      <option value="both">Both</option>
    </select>
    <button id="btn-generate" type="button">{{generate_label}}</button>
    <button id="btn-archive" type="button">Archive</button>
    <button id="btn-theme" type="button" aria-pressed="false" title="Switch to dark mode" class="btn-theme">
      <span class="sr-only">Switch theme</span>
      <span aria-hidden="true" class="theme-icon theme-icon--light">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-moon" viewBox="0 0 16 16"><path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278M4.858 1.311A7.27 7.27 0 0 0 1.025 7.71c0 4.02 3.279 7.276 7.319 7.276a7.32 7.32 0 0 0 5.205-2.162q-.506.063-1.029.063c-4.61 0-8.343-3.714-8.343-8.29 0-1.167.242-2.278.681-3.286"/></svg>
      </span>
      <span aria-hidden="true" class="theme-icon theme-icon--dark">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sun" viewBox="0 0 16 16"><path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/></svg>
      </span>
    </button>
    <button id="btn-logs" type="button">Logs</button>
  </div>
  <section id="gen-panel" class="gen-panel" hidden aria-live="polite"></section>
  <pre id="log-popup" hidden>Logs appear here while a brief is being generated.</pre>

  <header class="text-center" data-swap="masthead">
    <div class="flex items-center justify-between border-b border-stone-400 pb-1 text-[11px] font-semibold uppercase tracking-[0.2em] text-stone-500 dark:border-slate-600 dark:text-slate-400">
      <span>{{edition}}</span>
      <span>Research &amp; Silicon</span>
      <span>Set {{generated}}</span>
    </div>
  <h1 class="mt-3 text-5xl font-black uppercase tracking-tight sm:text-7xl" style="display:inline-flex; align-items:center; gap:0.25em;">
    <span>{{paper_name}}</span>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
        width="0.9em" height="0.9em" style="flex:none" aria-hidden="true" focusable="false">
      <path d="M13 1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2zM3 0a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V3a3 3 0 0 0-3-3z"/>
      <path d="M5.5 4a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m8 8a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m-4-4a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m4-4a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m-8 8a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
    </svg>
  </h1>
    <div class="mt-3 border-y-4 border-double border-stone-800 py-1.5 text-sm italic text-stone-600 dark:border-slate-400 dark:text-slate-300">{{date_long}}</div>
</header>

  <main class="mt-6 grid grid-cols-1 gap-8 md:grid-cols-2 md:gap-0 md:divide-x md:divide-stone-400 dark:md:divide-slate-700">
    <section data-swap="desk-primary" class="md:pr-6">
      <h2 class="border-b-2 border-stone-800 pb-1 text-xs font-bold uppercase tracking-[0.25em] text-amber-700 dark:border-slate-400 dark:text-amber-400">{{primary_title}}</h2>
      <p class="mt-2 text-sm italic text-stone-600 dark:text-slate-400" data-desk-deck="primary">{{primary_deck}}</p>
      <div data-desk-stories="primary">{{primary_stories}}</div>
    </section>
    <section data-swap="desk-science" class="md:pl-6">
      <h2 class="border-b-2 border-stone-800 pb-1 text-xs font-bold uppercase tracking-[0.25em] text-amber-700 dark:border-slate-400 dark:text-amber-400">{{science_title}}</h2>
      <p class="mt-2 text-sm italic text-stone-600 dark:text-slate-400" data-desk-deck="science">{{science_deck}}</p>
      <div data-desk-stories="science">{{science_stories}}</div>
    </section>
  </main>

  <footer class="mt-10 border-t-4 border-double border-stone-800 pt-3 text-center text-[11px] leading-relaxed text-stone-500 dark:border-slate-400 dark:text-slate-400" data-swap="footer">
    {{footer}}
  </footer>
</div>
</body>
</html>
