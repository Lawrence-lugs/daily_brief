<section data-swap="desk-{{key}}" class="md:pr-6">
  <h2 class="border-b-2 border-stone-800 pb-1 text-xs font-bold uppercase tracking-[0.25em] text-amber-700 dark:border-slate-400 dark:text-amber-400">{{title}}</h2>
  <p class="mt-2 text-sm italic text-stone-600 dark:text-slate-400" data-desk-deck="{{key}}">{{deck}}</p>
  <div data-desk-stories="{{key}}">{{stories}}</div>
</section>
