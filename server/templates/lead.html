<article class="mt-4 border-b border-stone-300 pb-5 dark:border-slate-700">
  <div class="flex flex-wrap items-center gap-1.5">{{badge}}{{raw_note}}{{tags}}</div>
  <h3 class="mt-2 text-2xl font-extrabold leading-tight sm:text-3xl"><a href="{{url}}" class="hover:underline hover:decoration-amber-600 dark:hover:decoration-amber-400">{{headline}}</a></h3>
  <p class="mt-2 text-[15px] leading-relaxed text-stone-800 dark:text-slate-300">{{blurb}}</p>
  {{why}}
  <div class="flex items-center justify-between mt-2">
    <p class="text-[11px] uppercase tracking-wider text-stone-500 dark:text-slate-500 m-0">{{source}} &middot; {{age}}</p>
    <div class="story-actions">
      <button type="button" class="btn-save" aria-pressed="false" data-action="save" data-story-id="{{id}}" title="Save story">
        <span class="save-mark" aria-hidden="true"></span>
        <span class="sr-only">Save story</span>
      </button>
      <button type="button" class="btn-like" aria-pressed="false" data-action="like" data-story-id="{{id}}" title="Like story">
        <span class="like-mark" aria-hidden="true">&#x1F516;</span>
        <span class="sr-only">Like story</span>
      </button>
    </div>
  </div>
</article>
