<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>The Daily Die - Archive</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/list.css">
<script src="/static/vendor/gridjs.umd.js" defer></script>
<script src="/static/list.js" defer></script>
</head>
<body>
<main class="newspaper-shell">
  <header class="paper-heading">
    <h1>The Daily Die &mdash; Archive</h1>
    <small><a id="back" href="/">Latest brief</a> &middot; <span id="count"></span></small>
  </header>

  <form id="filters" class="archive-filters" autocomplete="off">
    <input id="q" class="gridjs-input" type="search"
           placeholder="Search&hellip;  e.g.  dataflow   title:sparse   &quot;kv cache&quot;   tag:accel">
    <div id="mark" class="seg" role="group" aria-label="Show">
      <button type="button" data-mark="" aria-pressed="true">All</button>
      <button type="button" data-mark="liked" aria-pressed="false">Liked</button>
      <button type="button" data-mark="saved" aria-pressed="false">Saved</button>
      <button type="button" data-mark="any" aria-pressed="false">Liked or saved</button>
    </div>
    <select id="desk" aria-label="Desk"><option value="">All desks</option></select>
    <select id="subtopic" aria-label="Subtopic"><option value="">All subtopics</option></select>
    <select id="source" aria-label="Source"><option value="">All sources</option></select>
    <label>From <input id="from" type="date"></label>
    <label>To <input id="to" type="date"></label>
    <select id="sort" aria-label="Sort">
      <option value="">Best match / newest</option>
      <option value="date_desc">Newest first</option>
      <option value="date_asc">Oldest first</option>
    </select>
    <button type="button" id="btn-theme" class="btn-theme" aria-pressed="false" title="Switch to dark mode">
      <span class="sr-only">Switch theme</span>
      <span aria-hidden="true" class="theme-icon theme-icon--light">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-moon" viewBox="0 0 16 16"><path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278M4.858 1.311A7.27 7.27 0 0 0 1.025 7.71c0 4.02 3.279 7.276 7.319 7.276a7.32 7.32 0 0 0 5.205-2.162q-.506.063-1.029.063c-4.61 0-8.343-3.714-8.343-8.29 0-1.167.242-2.278.681-3.286"/></svg>
      </span>
      <span aria-hidden="true" class="theme-icon theme-icon--dark">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sun" viewBox="0 0 16 16"><path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/></svg>
      </span>
    </button>
    <button type="button" id="reset">Reset</button>
  </form>
  <div id="tagbar" class="tagbar" aria-label="Tags"></div>

  <div id="grid" aria-label="Story archive"></div>
</main>
<script>document.getElementById('back').href = '/' + location.search;</script>
</body>
</html>
