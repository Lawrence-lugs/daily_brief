<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Settings — Daily Brief</title>
<base href="{{basePath}}/">
<link rel="stylesheet" href="static/app.css">
<link rel="stylesheet" href="static/tailwind.css">
<link rel="stylesheet" href="static/vendor/bootstrap-icons/bootstrap-icons.css">
<style>
  :root {
    color-scheme: light;
    --settings-bg: #ece7dc;
    --settings-surface: #fbf8f1;
    --settings-surface-raised: #fffdf8;
    --settings-fg: #3b362e;
    --settings-muted: #6f665b;
    --settings-line: #cfc6b6;
    --settings-hover: #e0d8c8;
    --settings-accent: #b45309;
    --settings-on-accent: #fbf8f1;
    --settings-ok: #4d7c0f;
    --settings-error: #b91c1c;
    --settings-shadow: 0 12px 36px rgba(59, 54, 46, .08);
  }
  html.dark {
    color-scheme: dark;
    --settings-bg: #0b1016;
    --settings-surface: #111923;
    --settings-surface-raised: #151f2b;
    --settings-fg: #cbd5e1;
    --settings-muted: #94a3b8;
    --settings-line: #263344;
    --settings-hover: #1b2938;
    --settings-accent: #fbbf24;
    --settings-on-accent: #0b1016;
    --settings-ok: #86efac;
    --settings-error: #fca5a5;
    --settings-shadow: 0 12px 36px rgba(0, 0, 0, .22);
  }

  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    background: var(--settings-bg);
    color: var(--settings-fg);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--settings-accent);
    outline-offset: 2px;
  }
  .page-shell {
    width: min(1440px, 100%);
    margin: 0 auto;
    padding: 28px clamp(16px, 3vw, 40px) 48px;
  }
  .page-header {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 48px;
    margin-bottom: 22px;
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--settings-muted);
    text-decoration: none;
    font-size: .875rem;
    white-space: nowrap;
  }
  .back:hover { color: var(--settings-accent); }
  .page-heading { min-width: 0; }
  .page-heading h1 {
    margin: 0;
    color: var(--settings-fg);
    font-size: 1.3rem;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .page-heading p {
    margin: 3px 0 0;
    color: var(--settings-muted);
    font-size: .8rem;
  }
  .header-spacer { flex: 1; }
  #btn-theme {
    border: 1px solid var(--settings-line);
    border-radius: 7px;
    background: var(--settings-surface);
    color: var(--settings-fg);
    cursor: pointer;
    min-width: 36px;
    min-height: 36px;
  }
  #btn-theme:hover { background: var(--settings-hover); }

  .tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    padding: 0 0 10px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--settings-line);
    scrollbar-width: thin;
  }
  .tab {
    flex: 0 0 auto;
    padding: 8px 13px;
    border: 1px solid transparent;
    border-radius: 7px 7px 0 0;
    background: transparent;
    color: var(--settings-muted);
    cursor: pointer;
    font-size: .85rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .tab:hover { background: var(--settings-hover); color: var(--settings-fg); }
  .tab.active {
    border-color: var(--settings-line);
    border-bottom-color: var(--settings-surface);
    margin-bottom: -11px;
    background: var(--settings-surface);
    color: var(--settings-accent);
  }
  .file-card {
    overflow: hidden;
    border: 1px solid var(--settings-line);
    border-radius: 0 10px 10px 10px;
    background: var(--settings-surface);
    box-shadow: var(--settings-shadow);
  }
  .file-card[hidden] { display: none; }
  .file-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 18px 22px 15px;
    border-bottom: 1px solid var(--settings-line);
  }
  .file-heading { min-width: 0; }
  .file-name {
    display: block;
    color: var(--settings-fg);
    font-size: .95rem;
    font-weight: 700;
  }
  .file-desc {
    margin: 3px 0 0;
    color: var(--settings-muted);
    font-size: .8rem;
  }
  .file-kind {
    flex: 0 0 auto;
    margin-left: auto;
    padding: 3px 8px;
    border: 1px solid var(--settings-line);
    border-radius: 5px;
    color: var(--settings-muted);
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .file-content { padding: 20px 22px 8px; }
  .settings-editor { min-width: 0; }

  /* Jedison navigation: root schema properties become the section navigator. */
  .settings-editor .jedi-nav-row {
    display: grid;
    grid-template-columns: minmax(12rem, 16rem) minmax(0, 1fr);
    align-items: start;
    gap: 20px;
  }
  .settings-editor .jedi-nav-list-col {
    position: sticky;
    top: 12px;
    width: auto;
    min-width: 0;
    max-width: none;
    flex: none;
  }
  .settings-editor .jedi-nav-content-col {
    width: auto;
    min-width: 0;
    flex: none;
  }
  .settings-editor .jedi-nav-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .settings-editor .jedi-nav-list > li { margin: 0; padding: 0; }
  .settings-editor .jedi-nav-link {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    padding: 7px 10px;
    border: 1px solid transparent;
    border-left: 3px solid transparent;
    border-radius: 5px;
    color: var(--settings-muted);
    text-decoration: none;
    font-size: .82rem;
    line-height: 1.3;
    cursor: pointer;
  }
  .settings-editor .jedi-nav-link:hover {
    border-color: var(--settings-line);
    background: var(--settings-hover);
    color: var(--settings-fg);
  }
  .settings-editor .jedi-nav-list > li.active > .jedi-nav-link,
  .settings-editor .jedi-nav-link.active {
    border-color: var(--settings-line);
    border-left-color: var(--settings-accent);
    background: var(--settings-hover);
    color: var(--settings-fg);
    font-weight: 700;
  }
  .settings-editor .jedi-nav-text {
    min-width: 0;
    overflow-wrap: anywhere;
  }

  /* Reordering the dynamic object properties in config.desks. */
  .settings-editor .settings-desks-order-list > li {
    display: flex;
    align-items: stretch;
    gap: 5px;
    min-width: 0;
  }

  .settings-editor .settings-desks-order-list > li > .jedi-nav-link {
    flex: 1;
    min-width: 0;
  }

  .settings-editor .settings-desk-order-handle {
    display: grid;
    place-items: center;
    flex: 0 0 18px;
    color: var(--settings-muted);
    font-size: 16px;
    user-select: none;
    cursor: grab;
  }

  .settings-editor li[data-order-mode="locked"] .settings-desk-order-handle {
    opacity: .5;
    cursor: not-allowed;
  }

  .settings-editor li[data-order-mode="draggable"] .settings-desk-order-handle:hover {
    color: var(--settings-accent);
  }

  .settings-editor .settings-desks-order-list > li.is-dragging {
    opacity: .35;
  }

  .settings-editor .settings-desks-order-list > li.is-drop-before > .jedi-nav-link {
    box-shadow: inset 0 2px 0 var(--settings-accent);
  }

  .settings-editor .settings-desks-order-list > li.is-drop-after > .jedi-nav-link {
    box-shadow: inset 0 -2px 0 var(--settings-accent);
  }

  .settings-editor .jedi-tab-pane,
  .settings-editor .tab-pane { min-width: 0; }

  /* Schema-derived object grids. The transformer assigns 6/12-column spans. */
  .settings-editor .jedi-row {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 12px 16px;
    margin: 0;
    min-width: 0;
  }
  .settings-editor .jedi-col {
    float: none;
    width: auto;
    min-width: 0;
    max-width: none;
    padding: 0;
  }
  .settings-editor .jedi-col-xs-12 { grid-column: span 12; }
  .settings-editor .jedi-col-xs-6 { grid-column: span 12; }
  @media (min-width: 600px) {
    .settings-editor .jedi-col-sm-12 { grid-column: span 12; }
    .settings-editor .jedi-col-sm-6 { grid-column: span 6; }
  }
  @media (min-width: 900px) {
    .settings-editor .jedi-col-md-12 { grid-column: span 12; }
    .settings-editor .jedi-col-md-6 { grid-column: span 6; }
  }
  @media (min-width: 1200px) {
    .settings-editor .jedi-col-lg-12 { grid-column: span 12; }
    .settings-editor .jedi-col-lg-6 { grid-column: span 6; }
  }

  /* Consistent paper/slate controls for Jedison's base theme. */
  .settings-editor .jedi-editor-fieldset {
    min-width: 0;
    margin: 0 0 12px;
    padding: 13px 14px 12px;
    border: 1px solid var(--settings-line);
    border-radius: 8px;
    background: var(--settings-surface-raised);
  }
  .settings-editor .jedi-editor-legend { padding: 0 5px; }
  .settings-editor .jedi-legend,
  .settings-editor .jedi-label {
    color: var(--settings-fg);
    font-size: .8rem;
    font-weight: 650;
  }
  .settings-editor .jedi-description,
  .settings-editor .text-muted {
    display: block;
    margin: 3px 0 7px;
    color: var(--settings-muted);
    font-size: .75rem;
  }
  .settings-editor .jedi-children-slot { min-width: 0; }
  .settings-editor .jedi-editor-card {
    margin: 0 0 12px;
    overflow: hidden;
    border: 1px solid var(--settings-line);
    border-radius: 8px;
    background: var(--settings-surface-raised);
  }
  .settings-editor .jedi-editor-card-header {
    padding: 8px 11px;
    border-bottom: 1px solid var(--settings-line);
    background: var(--settings-hover);
  }
  .settings-editor .jedi-editor-card-body { padding: 11px 12px 3px; }
  .settings-editor .jedi-accordion-item {
    margin: 0 0 7px;
    overflow: hidden;
    border: 1px solid var(--settings-line);
    border-radius: 7px;
    background: var(--settings-surface-raised);
  }
  .settings-editor .jedi-accordion-toggle {
    width: 100%;
    padding: 9px 11px;
    border: 0;
    background: var(--settings-hover);
    color: var(--settings-fg);
    text-align: left;
    cursor: pointer;
    font-weight: 650;
  }
  .settings-editor .jedi-accordion-body { padding: 10px 12px 4px; }

  .settings-editor input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
  .settings-editor select,
  .settings-editor textarea {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 35px;
    padding: 7px 9px;
    border: 1px solid var(--settings-line);
    border-radius: 5px;
    background: var(--settings-surface);
    color: var(--settings-fg);
    font-size: .82rem;
    box-shadow: inset 0 1px 2px rgba(40, 30, 15, .035);
  }
  .settings-editor textarea { min-height: 76px; resize: vertical; }
  .settings-editor input[type="checkbox"],
  .settings-editor input[type="radio"] { accent-color: var(--settings-accent); }
  .settings-editor input:disabled,
  .settings-editor select:disabled,
  .settings-editor textarea:disabled { opacity: .6; cursor: not-allowed; }
  .settings-editor .jedi-messages-slot:empty { display: none; }
  .settings-editor .jedi-messages-slot { color: var(--settings-error); font-size: .75rem; }
  .settings-editor .jedi-btn {
    min-height: 27px;
    padding: 4px 7px;
    border: 1px solid var(--settings-line);
    border-radius: 5px;
    background: var(--settings-surface);
    color: var(--settings-muted);
    cursor: pointer;
    font-size: .72rem;
  }
  .settings-editor .jedi-btn:hover:not(:disabled) {
    border-color: var(--settings-accent);
    background: var(--settings-hover);
    color: var(--settings-fg);
  }
  .settings-editor .jedi-btn:disabled { opacity: .35; cursor: not-allowed; }

  /* Repeatable data is presented as individual cards. Destructive/reorder
     actions are progressively disclosed for the selected or focused item. */
  .settings-editor .jedi-array-item {
    min-width: 0;
    margin: 0 0 9px;
    padding: 8px 10px 10px;
    border: 1px solid var(--settings-line);
    border-radius: 7px;
    background: var(--settings-surface-raised);
  }
  .settings-editor .jedi-array-item > .jedi-actions-slot {
    display: flex;
    justify-content: flex-end;
    min-height: 24px;
    margin: 0 0 4px;
  }
  .settings-editor .jedi-array-actions-slot {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: opacity .12s ease;
  }
  .settings-editor .jedi-array-item:not(.is-active):not(:focus-within) .jedi-array-actions-slot {
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
  }
  .settings-editor .jedi-array-item.is-active > .jedi-actions-slot,
  .settings-editor .jedi-array-item:focus-within > .jedi-actions-slot {
    color: var(--settings-accent);
  }
  .settings-editor .jedi-array-footer {
    gap: 8px;
    padding: 9px 0 2px;
    border-top: 1px solid var(--settings-line);
  }
  .settings-editor .jedi-array-footer .jedi-btn,
  .settings-editor .jedi-array-add {
    border-color: var(--settings-accent);
    color: var(--settings-accent);
  }

  .file-actions {
    position: sticky;
    bottom: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 22px;
    border-top: 1px solid var(--settings-line);
    background: color-mix(in srgb, var(--settings-surface) 94%, transparent);
    backdrop-filter: blur(10px);
  }
  .save-hint { color: var(--settings-muted); font-size: .75rem; }
  .btn-save {
    flex: 0 0 auto;
    min-height: 36px;
    padding: 7px 14px;
    border: 1px solid var(--settings-accent);
    border-radius: 6px;
    background: var(--settings-accent);
    color: var(--settings-on-accent);
    cursor: pointer;
    font-size: .82rem;
    font-weight: 700;
  }
  .btn-save:hover:not(:disabled) { filter: brightness(1.06); }
  .btn-save:disabled { opacity: .5; cursor: not-allowed; }
  .loading { padding: 12px 0; color: var(--settings-muted); }
  .note { margin: 0 0 10px; color: var(--settings-muted); font-size: .8rem; }
  pre.error-json {
    max-height: 420px;
    margin: 0;
    padding: 12px;
    overflow: auto;
    border: 1px solid var(--settings-line);
    border-radius: 7px;
    background: var(--settings-surface-raised);
    color: var(--settings-fg);
    font: .78rem/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .error { color: var(--settings-error); font-size: .82rem; }
  .toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 1000;
    max-width: min(34rem, calc(100vw - 40px));
    padding: 10px 14px;
    border: 1px solid var(--settings-line);
    border-radius: 7px;
    background: var(--settings-surface-raised);
    color: var(--settings-fg);
    box-shadow: var(--settings-shadow);
    font-size: .82rem;
  }
  .toast.saved { border-left: 3px solid var(--settings-ok); }
  .toast.error { border-left: 3px solid var(--settings-error); }

  @media (max-width: 760px) {
    .page-shell { padding: 18px 12px 32px; }
    .page-header { flex-wrap: wrap; gap: 10px; }
    .page-heading { flex: 1 1 180px; }
    .file-header, .file-content { padding-left: 14px; padding-right: 14px; }
    .file-actions { padding-left: 14px; padding-right: 14px; }
    .settings-editor .jedi-nav-row { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .settings-editor .jedi-nav-list-col { position: static; }
    .settings-editor .jedi-nav-list {
      flex-direction: row;
      overflow-x: auto;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--settings-line);
    }
    .settings-editor .jedi-nav-list > li { flex: 0 0 auto; }
    .settings-editor .jedi-nav-link {
      min-height: 32px;
      padding: 6px 9px;
      border: 1px solid var(--settings-line);
      border-radius: 5px;
    }
    .settings-editor .jedi-nav-list > li.active > .jedi-nav-link,
    .settings-editor .jedi-nav-link.active { border-color: var(--settings-accent); }
  }
  @media (max-width: 520px) {
    .back { font-size: .8rem; }
    .page-heading h1 { font-size: 1.15rem; }
    .file-kind { display: none; }
    .file-actions { align-items: flex-start; flex-direction: column; }
    .btn-save { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .settings-editor .jedi-array-actions-slot { transition: none; }
  }
</style>
<script>
  // Share the same theme contract as the brief and archive pages:
  // URL override -> saved db-theme -> operating-system preference.
  (function () {
    const KEY = 'db-theme';
    window.setThemeSettings = (theme) => {
      const classes = document.documentElement.classList;
      classes.remove('dark', 'light');
      classes.add(theme === 'dark' ? 'dark' : 'light');
      try { localStorage.setItem(KEY, theme); } catch {}
      const button = document.getElementById('btn-theme');
      if (button) {
        button.setAttribute('aria-pressed', String(theme === 'dark'));
        button.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
      }
    };

    const queryTheme = new URLSearchParams(location.search).get('theme');
    let theme = queryTheme === 'dark' || queryTheme === 'light' ? queryTheme : null;
    if (!theme) {
      try {
        const saved = localStorage.getItem(KEY);
        theme = saved === 'dark' || saved === 'light' ? saved : null;
      } catch {}
    }
    if (!theme) {
      theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    window.setThemeSettings(theme);
  })();
</script>
</head>
<body data-base="{{basePath}}" class="bg-stone-100 text-stone-900 antialiased dark:bg-slate-950 dark:text-slate-200">
<div class="page-shell">
  <header class="page-header">
    <a href="{{basePath}}/" class="back"><i class="bi bi-arrow-left"></i> Back to brief</a>
    <div class="page-heading">
      <h1>Settings</h1>
      <p>Configure the inputs and behavior behind your daily brief.</p>
    </div>
    <span class="header-spacer"></span>
    <button id="btn-theme" class="btn-theme" aria-pressed="false" title="Switch to dark mode" type="button">
      <span aria-hidden="true" class="theme-icon theme-icon--light"><i class="bi bi-moon"></i></span>
      <span aria-hidden="true" class="theme-icon theme-icon--dark"><i class="bi bi-sun"></i></span>
    </button>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="Configuration files"></div>
  <main id="panels"></main>
</div>
<div id="toast" class="toast saved" role="status" aria-live="polite" hidden></div>

<script src="static/vendor/jedison.umd.js"></script>
<script>
const base = document.body.dataset.base || '';
const FILES = ['config.json', 'sources.json', 'perfect_samples.json'];

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
const toast = document.getElementById('toast');
const jedison = window.Jedison;
const instances = Object.create(null);

// Jedison's base theme ignores the isActive flag for nav panes, so every section
// stays visible in the right column. Hide the inactive ones here.
const SettingsTheme = jedison ? class extends jedison.Theme {
  setTabPaneAttributes(element, isActive, id) {
    super.setTabPaneAttributes(element, isActive, id);
    element.hidden = !isActive;
  }
} : null;

if (!jedison) {
  const error = document.createElement('div');
  error.className = 'error';
  error.textContent = 'Editor library failed to load (static/vendor/jedison.umd.js). Check the server logs.';
  panelsEl.appendChild(error);
}

function showToast(message, kind = 'saved') {
  toast.textContent = message;
  toast.className = 'toast ' + (kind === 'error' ? 'error' : 'saved');
  toast.hidden = false;
  clearTimeout(showToast.timeout);
  showToast.timeout = setTimeout(() => { toast.hidden = true; }, 3500);
}

function cloneJson(value) {
  return JSON.parse(JSON.stringify(value));
}

function schemaType(schema) {
  if (!schema || typeof schema !== 'object') return null;
  const declared = Array.isArray(schema.type) ? schema.type : [schema.type];
  if (declared.includes('object') || schema.properties || schema.patternProperties ||
      (schema.additionalProperties && typeof schema.additionalProperties === 'object')) return 'object';
  if (declared.includes('array') || schema.items) return 'array';
  return declared.find((type) => type && type !== 'null') || null;
}

function isComplexSchema(schema) {
  const type = schemaType(schema);
  return type === 'object' || type === 'array';
}

function withGridSpan(schema) {
  if (!schema || typeof schema !== 'object' || Array.isArray(schema)) return;
  if (schema['x-grid'] === undefined) {
    const fullWidth = isComplexSchema(schema);
    schema['x-grid'] = {
      columnsXs: 12,
      columnsSm: fullWidth ? 12 : 6,
      columnsMd: fullWidth ? 12 : 6,
      columnsLg: fullWidth ? 12 : 6
    };
  }
}

function decorateSchema(input, isRoot = false) {
  if (!input || typeof input !== 'object' || Array.isArray(input)) return input;

  const schema = input;
  const properties = schema.properties && typeof schema.properties === 'object'
    ? Object.entries(schema.properties)
    : [];
  const propertySchemas = properties.map(([, child]) => child);
  const hasDynamicProperties = schema.additionalProperties &&
    typeof schema.additionalProperties === 'object';
  const dynamicOnly = properties.length === 0 && hasDynamicProperties;
  const allChildrenComplex = propertySchemas.length > 1 && propertySchemas.every(isComplexSchema);

  // High-level objects become navigation. Dynamic-key maps also get their own
  // navigator, so keyword/feed/desk maps don't become another endless column.
  // Mixed/simple objects become responsive grids. Explicit schema formats win.
  // NOTE: Jedison reads layout hints via pe(schema, key) => schema['x-'+key],
  // so they must be written as x-prefixed keys (x-format, x-grid,
  // x-navMinWidth, x-navMaxWidth) or they are silently ignored.
  if (!schema['x-format']) {
    if ((isRoot && properties.length > 1) || dynamicOnly || allChildrenComplex) {
      schema['x-format'] = 'nav-vertical';
      schema['x-navMinWidth'] = schema['x-navMinWidth'] || '12rem';
      schema['x-navMaxWidth'] = schema['x-navMaxWidth'] || '17rem';
    } else if (properties.length > 1) {
      schema['x-format'] = 'grid';
    }
  }

  const useGrid = schema['x-format'] === 'grid';
  for (const [, child] of properties) {
    if (useGrid) withGridSpan(child);
    decorateSchema(child, false);
  }

  if (schema.patternProperties && typeof schema.patternProperties === 'object') {
    for (const child of Object.values(schema.patternProperties)) {
      if (useGrid) withGridSpan(child);
      decorateSchema(child, false);
    }
  }

  if (schema.additionalProperties && typeof schema.additionalProperties === 'object') {
    if (useGrid) withGridSpan(schema.additionalProperties);
    decorateSchema(schema.additionalProperties, false);
  }

  if (schema.items) {
    if (Array.isArray(schema.items)) schema.items.forEach((item) => decorateSchema(item, false));
    else decorateSchema(schema.items, false);
  }

  for (const keyword of ['allOf', 'anyOf', 'oneOf']) {
    if (Array.isArray(schema[keyword])) {
      schema[keyword].forEach((child) => decorateSchema(child, false));
    }
  }
  for (const keyword of ['definitions', '$defs']) {
    if (schema[keyword] && typeof schema[keyword] === 'object') {
      Object.values(schema[keyword]).forEach((child) => decorateSchema(child, false));
    }
  }

  return schema;
}

function selectFile(fileName) {
  for (const tab of tabsEl.querySelectorAll('.tab')) {
    const active = tab.dataset.file === fileName;
    tab.classList.toggle('active', active);
    tab.setAttribute('aria-selected', String(active));
    tab.tabIndex = active ? 0 : -1;
  }
  for (const panel of panelsEl.querySelectorAll('.file-card')) {
    panel.hidden = panel.dataset.file !== fileName;
  }
}

function activateArrayItem(item) {
  const group = item.parentElement;
  if (!group) return;
  for (const sibling of group.children) {
    if (sibling.classList?.contains('jedi-array-item')) {
      sibling.classList.toggle('is-active', sibling === item);
    }
  }
}

function bindArrayItemSelection(root) {
  const selectFromEvent = (event) => {
    const item = event.target.closest?.('.jedi-array-item');
    if (item && root.contains(item)) activateArrayItem(item);
  };
  root.addEventListener('pointerdown', selectFromEvent);
  root.addEventListener('focusin', selectFromEvent);
}

function findSchemaControl(root, propertyName) {
  return Array.from(root.querySelectorAll('[data-path]')).find((el) => {
    const parts = (el.dataset.path || '').split('/').filter(Boolean);
    return parts.at(-1) === propertyName;
  });
}

function getDeskNavList(root) {
  const desksControl = findSchemaControl(root, 'desks');
  const list = desksControl?.querySelector(
    '.jedi-nav-list-col > .jedi-nav-list'
  );

  if (list) list.classList.add('settings-desks-order-list');
  return list || null;
}

function getDeskKey(item) {
  return item.querySelector('.jedi-nav-text')
    ?.textContent
    ?.trim()
    .replace(/^⚠\s*/, '') || '';
}

function decorateDeskNavItems(list, lockedKeys) {
  for (const item of list.children) {
    if (item.tagName !== 'LI') continue;

    const key = getDeskKey(item);
    if (!key) continue;

    const locked = lockedKeys.has(key);
    item.dataset.orderMode = locked ? 'locked' : 'draggable';

    let handle = Array.from(item.children).find((child) =>
      child.classList.contains('settings-desk-order-handle')
    );

    if (!handle) {
      handle = document.createElement('span');
      handle.className = 'settings-desk-order-handle';
      handle.setAttribute('aria-hidden', 'true');
      item.prepend(handle);
    }

    handle.textContent = locked ? '🔒' : '⠿';
    handle.draggable = !locked;
    handle.title = locked ? 'Desk order is locked' : 'Drag to reorder desks';

    const link = item.querySelector('.jedi-nav-link');
    if (link) link.draggable = false;
  }
}

function moveDeskItem(list, dragged, target, after) {
  const children = Array.from(list.children);

  // Locked entries retain their absolute positions.
  const movableSlots = children
    .map((item, index) =>
      item.dataset.orderMode === 'draggable' ? index : -1
    )
    .filter((index) => index >= 0);

  const movable = movableSlots.map((index) => children[index]);

  const from = movable.indexOf(dragged);
  const targetIndex = movable.indexOf(target);

  if (from < 0 || targetIndex < 0) return;

  let insertionIndex = targetIndex + (after ? 1 : 0);

  const [item] = movable.splice(from, 1);

  if (from < insertionIndex) insertionIndex--;

  movable.splice(insertionIndex, 0, item);

  // Write the reordered items back into their original movable slots.
  movableSlots.forEach((slot, index) => {
    children[slot] = movable[index];
  });

  children.forEach((child) => list.appendChild(child));
}

function bindDeskReordering(root, schema) {
  const list = getDeskNavList(root);
  if (!list) {
    console.warn('Could not find the desks navigation list.');
    return;
  }

  const lockedKeys = new Set(
    schema?.properties?.desks?.['x-ui-locked-keys'] || []
  );

  decorateDeskNavItems(list, lockedKeys);

  // Dynamic properties added through Jedison should get the same treatment.
  const observer = new MutationObserver(() => {
    decorateDeskNavItems(list, lockedKeys);
  });
  observer.observe(list, { childList: true });

  let draggedItem = null;

  function clearDropFeedback() {
    list.querySelectorAll('.is-drop-before, .is-drop-after').forEach((item) => {
      item.classList.remove('is-drop-before', 'is-drop-after');
    });
  }

  function getListItem(target) {
    const item = target.closest?.('li');
    return item && item.parentElement === list ? item : null;
  }

  function isAfter(event, item) {
    const rect = item.getBoundingClientRect();
    return event.clientY > rect.top + rect.height / 2;
  }

  list.addEventListener('dragstart', (event) => {
    const handle = event.target.closest?.('.settings-desk-order-handle');
    const item = handle?.parentElement;

    if (
      !handle ||
      !list.contains(handle) ||
      !item ||
      item.dataset.orderMode !== 'draggable'
    ) {
      event.preventDefault();
      return;
    }

    draggedItem = item;
    item.classList.add('is-dragging');

    if (event.dataTransfer) {
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', getDeskKey(item));
    }
  });

  list.addEventListener('dragover', (event) => {
    if (!draggedItem) return;

    const target = getListItem(event.target);

    if (
      !target ||
      target === draggedItem ||
      target.dataset.orderMode !== 'draggable'
    ) return;

    event.preventDefault();
    clearDropFeedback();

    target.classList.add(
      isAfter(event, target) ? 'is-drop-after' : 'is-drop-before'
    );

    if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
  });

  list.addEventListener('drop', (event) => {
    if (!draggedItem) return;

    const target = getListItem(event.target);

    if (
      !target ||
      target === draggedItem ||
      target.dataset.orderMode !== 'draggable'
    ) return;

    event.preventDefault();

    moveDeskItem(list, draggedItem, target, isAfter(event, target));

    draggedItem.classList.remove('is-dragging');
    draggedItem = null;
    clearDropFeedback();
  });

  list.addEventListener('dragend', () => {
    draggedItem?.classList.remove('is-dragging');
    draggedItem = null;
    clearDropFeedback();
  });
}

function getDeskOrder(root) {
  const list = getDeskNavList(root);
  if (!list) return [];

  return Array.from(list.children)
    .filter((item) => item.tagName === 'LI')
    .map(getDeskKey)
    .filter(Boolean);
}

function reorderObjectProperties(object, order) {
  if (!object || typeof object !== 'object' || Array.isArray(object)) {
    return object;
  }

  const entries = new Map(Object.entries(object));
  const result = [];
  const seen = new Set();

  // First, use the visual order.
  for (const key of order) {
    if (entries.has(key) && !seen.has(key)) {
      result.push([key, entries.get(key)]);
      seen.add(key);
    }
  }

  // Preserve any properties not represented in the navigation list.
  for (const [key, value] of entries) {
    if (!seen.has(key)) result.push([key, value]);
  }

  return Object.fromEntries(result);
}

function createFileTab(fileName, index) {
  const tab = document.createElement('button');
  tab.type = 'button';
  tab.className = 'tab' + (index === 0 ? ' active' : '');
  tab.dataset.file = fileName;
  tab.id = 'tab-' + fileName;
  tab.setAttribute('role', 'tab');
  tab.setAttribute('aria-controls', 'panel-' + fileName);
  tab.setAttribute('aria-selected', String(index === 0));
  tab.tabIndex = index === 0 ? 0 : -1;
  tab.textContent = fileName;
  tab.addEventListener('click', () => selectFile(fileName));
  return tab;
}

function createPanel(fileName, index) {
  const panel = document.createElement('section');
  panel.className = 'file-card';
  panel.id = 'panel-' + fileName;
  panel.dataset.file = fileName;
  panel.setAttribute('role', 'tabpanel');
  panel.setAttribute('aria-labelledby', 'tab-' + fileName);
  panel.hidden = index !== 0;

  const header = document.createElement('div');
  header.className = 'file-header';
  const heading = document.createElement('div');
  heading.className = 'file-heading';
  const name = document.createElement('span');
  name.className = 'file-name';
  name.textContent = fileName;
  const desc = document.createElement('p');
  desc.className = 'file-desc';
  desc.textContent = 'Loading schema…';
  heading.append(name, desc);
  const kind = document.createElement('span');
  kind.className = 'file-kind';
  kind.textContent = 'JSON settings';
  header.append(heading, kind);

  const loading = document.createElement('div');
  loading.className = 'loading';
  loading.textContent = 'Loading ' + fileName + '…';

  const content = document.createElement('div');
  content.className = 'file-content';
  const root = document.createElement('div');
  root.className = 'settings-editor';
  root.id = 'jedison-' + fileName;
  content.append(root);

  const status = document.createElement('div');
  status.id = 'status-' + fileName;

  const actions = document.createElement('div');
  actions.className = 'file-actions';
  const hint = document.createElement('span');
  hint.className = 'save-hint';
  hint.textContent = 'Changes take effect the next time a brief is generated.';
  const save = document.createElement('button');
  save.type = 'button';
  save.className = 'btn-save';
  save.textContent = 'Save ' + fileName;
  actions.append(hint, save);

  panel.append(header, loading, content, status, actions);
  return { panel, loading, root, name, desc, status, save };
}

async function loadFile(fileName, index) {
  const ui = createPanel(fileName, index);
  panelsEl.append(ui.panel);

  ui.save.disabled = true;
  ui.save.addEventListener('click', async () => {
    if (!instances[fileName]) return;
    ui.save.disabled = true;
    ui.save.textContent = 'Saving…';
    try {
      const value = instances[fileName].getValue();

      // Desk order is semantically meaningful: server/lib/config.js uses
      // Object.entries(config.desks), which preserves this insertion order.
      if (fileName === 'config.json' && value?.desks) {
        value.desks = reorderObjectProperties(
          value.desks,
          getDeskOrder(ui.root)
        );
      }

      const response = await fetch(base + '/api/config/' + encodeURIComponent(fileName), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Brief-Client': '1' },
        body: JSON.stringify(value)
      });
      const result = await response.json();
      if (response.ok) {
        showToast(fileName + ' saved. Applies on next brief generation.');
        ui.save.textContent = 'Saved';
        setTimeout(() => {
          ui.save.textContent = 'Save ' + fileName;
          ui.save.disabled = false;
        }, 1500);
      } else {
        const detail = (result.details || []).slice(0, 3)
          .map((entry) => entry.path + ': ' + entry.message).join('; ');
        showToast('Save failed: ' + (result.error || 'error') +
          (detail ? ' — ' + detail : ''), 'error');
        ui.save.textContent = 'Save ' + fileName;
        ui.save.disabled = false;
      }
    } catch (error) {
      showToast('Save error: ' + error.message, 'error');
      ui.save.textContent = 'Save ' + fileName;
      ui.save.disabled = false;
    }
  });

  try {
    const [dataResponse, schemaResponse] = await Promise.all([
      fetch(base + '/api/config/' + encodeURIComponent(fileName)),
      fetch(base + '/api/config/' + encodeURIComponent(fileName) + '/schema')
    ]);
    const data = dataResponse.ok ? await dataResponse.json() : null;
    const schema = schemaResponse.ok ? await schemaResponse.json() : null;
    ui.loading.remove();

    if (!dataResponse.ok || data === null) {
      const error = document.createElement('div');
      error.className = 'error';
      error.textContent = 'Could not load ' + fileName + '.';
      ui.status.append(error);
      return;
    }

    if (schema && jedison) {
      ui.name.textContent = schema.title || fileName;
      ui.desc.textContent = schema.description || 'Edit and save this configuration file.';
      const displaySchema = decorateSchema(cloneJson(schema), true);
      instances[fileName] = new jedison.Create({
        container: ui.root,
        theme: new SettingsTheme(),
        schema: displaySchema
      });
      instances[fileName].setValue(data, false);

      bindArrayItemSelection(ui.root);

      if (fileName === 'config.json') {
        bindDeskReordering(ui.root, displaySchema);
      }

      ui.save.disabled = false;
    } else {
      const note = document.createElement('p');
      note.className = 'note';
      note.textContent = schema
        ? 'The schema editor is unavailable. Raw JSON is shown instead.'
        : 'No JSON Schema is available for this file. Raw JSON is shown read-only.';
      const pre = document.createElement('pre');
      pre.className = 'error-json';
      pre.textContent = JSON.stringify(data, null, 2);
      ui.root.append(note, pre);
      ui.save.disabled = true;
      ui.save.title = 'A schema is required to edit this file.';
    }
  } catch (error) {
    ui.loading.remove();
    const message = document.createElement('div');
    message.className = 'error';
    message.textContent = 'Error loading ' + fileName + ': ' + error.message;
    ui.status.append(message);
  }
}

async function init() {
  FILES.forEach((fileName, index) => tabsEl.append(createFileTab(fileName, index)));
  await Promise.all(FILES.map((fileName, index) => loadFile(fileName, index)));
}

const themeButton = document.getElementById('btn-theme');
if (themeButton) {
  themeButton.addEventListener('click', () => {
    window.setThemeSettings(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
  });
}

// Jedison nav links use href="#tab-pane-...". With <base href="/"> (basePath
// empty) those hash links resolve against the site root, so clicking a side
// button navigates away from /settings. Cancel the default navigation here.
// Jedison's <li> click handler only records the active tab; it does not
// re-render, so emit a root change to make the nav editor refresh.
document.addEventListener('click', (e) => {
  const link = e.target.closest('.jedi-nav-link');
  if (!link) return;
  e.preventDefault();
  for (const instance of Object.values(instances)) {
    const container = instance.root?.ui?.control?.container;
    if (container && container.contains(link)) instance.root.emit('change');
  }
});

init();
</script>
</body>
</html>
