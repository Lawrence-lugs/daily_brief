name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install pytest

      - name: Unit tests
        run: npm test

      - name: Python tests
        run: python -m pytest tests -q

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E on unpacked repo
        run: npm run test:e2e

      - name: Pack app
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''

      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Packed app smoke test
        shell: bash
        env:
          BRIEF_PORT: '4899'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a npx playwright test -c playwright.packed.config.js
          else
            npx playwright test -c playwright.packed.config.js
          fi

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn
