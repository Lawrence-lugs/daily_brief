name: Build and release installers

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.13'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build installers (npm run dist)
        run: npm run dist
        env:
          # electron-builder may need these for code signing on macOS; left empty
          # so builds are unsigned unless secrets are provided.
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: release/*
          retention-days: 90
          if-no-files-found: warn

      - name: Publish release assets (on tagged releases)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
